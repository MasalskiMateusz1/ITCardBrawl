# Production: the app (Spring + SPA in one image) behind the Caddy reverse proxy with TLS (Let's Encrypt).
# On the server in /opt/itcardbrawl next to this file (not in the repo, see deploy/README.md):
#   .env    - APP_TAG (set by deploy.sh) and APP_DOMAIN
#   app.env - SPRING_PROFILES_ACTIVE=prod and the OAuth2 secrets (chmod 600)
name: itcardbrawl

services:
  app:
    image: ghcr.io/masalskimateusz1/itcardbrawl:${APP_TAG:?APP_TAG nie ustawiony w .env}
    env_file: app.env
    restart: unless-stopped
    # Healthcheck from the image (HEALTHCHECK in the Dockerfile, /api/ping). No published ports:
    # outside traffic only through Caddy on the compose network (app:8080).

  caddy:
    # Pinned version (minor line): deploy.sh pulls only app, Caddy is updated by hand
    # (see deploy/README.md, "Aktualizacja Caddy").
    image: caddy:2.11
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN nie ustawiony w .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
