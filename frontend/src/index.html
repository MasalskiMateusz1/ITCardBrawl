<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>ItCardBrawl</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
  <script>
    // Set <html lang> before bootstrap; mirrors LanguageService (stored choice, else browser language).
    (function () {
      var lang = /^pl/i.test(navigator.language || '') ? 'pl' : 'en';
      try {
        var stored = localStorage.getItem('itcardbrawl.language');
        if (stored === 'pl' || stored === 'en') lang = stored;
      } catch (e) {}
      document.documentElement.lang = lang;
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
