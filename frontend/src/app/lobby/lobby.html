@if (user(); as player) {
  @if (player.avatarUrl !== null) {
    <img [src]="player.avatarUrl" alt="" referrerpolicy="no-referrer" width="48" height="48" />
  }
  <p>{{ texts().lobby.welcome(player.displayName) }}</p>
}

<a routerLink="/new-match">{{ texts().lobby.newMatch }}</a>

<button type="button" [disabled]="loggingOut()" (click)="logout()">{{ texts().lobby.logout }}</button>

@if (logoutFailed()) {
  <p class="message">{{ texts().lobby.logoutFailed }}</p>
}
