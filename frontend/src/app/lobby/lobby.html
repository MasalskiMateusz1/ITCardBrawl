@if (user(); as player) {
  @if (player.avatarUrl !== null) {
    <img [src]="player.avatarUrl" alt="" referrerpolicy="no-referrer" width="48" height="48" />
  }
  <p>Witaj, {{ player.displayName }}</p>
}

<a routerLink="/new-match">Nowa partia</a>

<button type="button" [disabled]="loggingOut()" (click)="logout()">Wyloguj</button>

@if (logoutError(); as text) {
  <p class="message">{{ text }}</p>
}
