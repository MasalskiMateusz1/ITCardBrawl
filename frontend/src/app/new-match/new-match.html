<h1>{{ texts().newMatch.title }}</h1>

<fieldset>
  <legend>{{ texts().newMatch.chooseFaction }}</legend>
  @for (faction of factions(); track faction.id) {
    <label>
      <input
        type="radio"
        name="faction"
        [value]="faction.id"
        [checked]="selectedFactionId() === faction.id"
        (change)="select(faction.id)"
      />
      <strong>{{ faction.name }}</strong>
      <span>{{ faction.description }}</span>
    </label>
  }
</fieldset>

<button type="button" [disabled]="selectedFactionId() === null || factions().length === 0 || starting()" (click)="start()">
  {{ texts().newMatch.start }}
</button>

@if (errorText(); as text) {
  <p class="message">{{ text }}</p>
}

<a routerLink="/">{{ texts().newMatch.backToLobby }}</a>
