<h3 class="label events-heading">{{ texts().matchTable.activeEvents }}</h3>
<ul class="events">
  @for (event of events(); track event.instanceId) {
    <li
      class="event"
      tabindex="0"
      [attr.data-faction]="event.faction"
      (mouseenter)="emitPreview(event.instanceId, $event)"
      (mouseleave)="preview.emit(null)"
      (focusin)="emitPreview(event.instanceId, $event)"
      (focusout)="preview.emit(null)"
    >
      <span class="event-name">{{ event.name }}</span>
      <span class="event-turns">{{ texts().matchTable.turnsLeft(event.turnsLeft) }}</span>
      @if (event.targetName; as targetName) {
        <span class="event-target-name">{{ texts().matchTable.eventTarget(targetName) }}</span>
      }
    </li>
  }
</ul>
