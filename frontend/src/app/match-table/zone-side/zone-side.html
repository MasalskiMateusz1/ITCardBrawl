<h3 class="label events-heading">{{ texts().matchTable.activeEvents }}</h3>
@if (events().length === 0) {
  <p class="none">{{ texts().matchTable.none }}</p>
} @else {
  <button
    type="button"
    class="events-open"
    [attr.aria-label]="texts().matchTable.showActiveEvents(events().length)"
    [attr.aria-expanded]="expanded()"
    (click)="toggled.emit()"
  >
    <span class="events" [style.--n]="layers().length">
      @for (event of layers(); track event.instanceId; let i = $index) {
        <span class="event" [style.--i]="i">
          <app-card
            variant="compact"
            type="EVENT"
            [cardId]="event.cardId"
            [faction]="event.faction"
            [name]="event.name"
            [cost]="event.cost"
            [turnsLeft]="event.turnsLeft"
          />
        </span>
      }
    </span>
    <span class="events-count" aria-hidden="true">{{ events().length }}</span>
  </button>
}
