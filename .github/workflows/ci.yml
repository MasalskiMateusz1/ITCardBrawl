name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # PR: nowszy push anuluje starsze uruchomienie; main: kazde uruchomienie konczy sie
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Testy backendu
        run: ./mvnw -B verify

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Wersja npm zgodna z "packageManager" w frontend/package.json (jak w Dockerfile)
      - name: npm zgodny z packageManager
        run: npm install -g npm@12.1.0

      - name: Instalacja zaleznosci frontu
        working-directory: frontend
        run: npm ci

      - name: Testy frontu
        working-directory: frontend
        run: npx ng test --watch=false

      - name: Build produkcyjny SPA
        working-directory: frontend
        run: npm run build

  # Obraz tylko z kodu, ktory przeszedl testy, i tylko z push na main
  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nazwa obrazu malymi literami (wymog GHCR)
      - name: Build i push obrazu
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/masalskimateusz1/itcardbrawl:${{ github.sha }}
            ghcr.io/masalskimateusz1/itcardbrawl:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # Katalog na serwerze (/opt/itcardbrawl) wpisany doslownie w poleceniach ssh: zmienne
      # przekazywane sa jako osobne argumenty, nie rozwijane wewnatrz zdalnego polecenia.
      # Klucz i known_hosts z sekretow; host "prod" w ~/.ssh/config (StrictHostKeyChecking domyslnie yes)
      - name: Konfiguracja SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ConnectTimeout 20
          EOF
          chmod 600 ~/.ssh/config

      # Suma Caddyfile przed i po kopiowaniu decyduje o przeladowaniu Caddy
      - name: Kopiowanie plikow na serwer
        id: upload
        run: |
          old=$(ssh prod "sha256sum /opt/itcardbrawl/Caddyfile 2>/dev/null | cut -d' ' -f1" || true)
          scp deploy/compose.yaml deploy/Caddyfile deploy/deploy.sh prod:/opt/itcardbrawl/
          ssh prod chmod +x /opt/itcardbrawl/deploy.sh
          new=$(sha256sum deploy/Caddyfile | cut -d' ' -f1)
          if [ "$old" != "$new" ]; then
            echo "caddyfile_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "caddyfile_changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Token biezacego joba przez stdin SSH - nie trafia do argumentow ani logow
      - name: Logowanie serwera do GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | ssh prod docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # deploy.sh sam wraca do poprzedniej wersji, gdy nowa nie jest zdrowa
      - name: Wdrozenie
        env:
          CADDYFILE_CHANGED: ${{ steps.upload.outputs.caddyfile_changed }}
        run: |
          # SHA przez stdin (xargs na serwerze) - nie jest wklejany do zdalnego polecenia
          printf '%s' "$GITHUB_SHA" | ssh prod xargs /opt/itcardbrawl/deploy.sh
          if [ "$CADDYFILE_CHANGED" = "true" ]; then
            ssh prod "cd /opt/itcardbrawl && docker compose exec -T -w /etc/caddy caddy caddy reload"
          fi

      # Weryfikacja z zewnatrz: publiczny adres przez Caddy i TLS
      - name: Smoke test
        id: smoke
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          ok=false
          for _ in $(seq 1 12); do
            if curl -fsS --max-time 10 "https://${APP_DOMAIN}/api/ping" | grep -q '"status":"ok"'; then
              ok=true
              break
            fi
            sleep 5
          done
          if [ "$ok" != true ]; then
            echo "::error::/api/ping nie odpowiada {\"status\":\"ok\"} po ~60 s"
            exit 1
          fi
          curl -fsS --max-time 10 "https://${APP_DOMAIN}/" | grep -q '<app-root>' \
            || { echo "::error::strona glowna nie zawiera <app-root>"; exit 1; }

      # Tylko porazka smoke testu - porazke samego wdrozenia obsluguje deploy.sh
      - name: Rollback
        if: failure() && steps.smoke.outcome == 'failure'
        run: ssh prod /opt/itcardbrawl/deploy.sh rollback
