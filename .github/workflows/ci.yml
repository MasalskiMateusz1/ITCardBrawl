name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # PR: a newer push cancels the older run; main: a run in progress is not cancelled,
  # but the newest one replaces those waiting in the queue (the latest commit is always deployed)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Testy backendu
        run: ./mvnw -B verify

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm version matching "packageManager" in frontend/package.json (as in the Dockerfile)
      - name: npm zgodny z packageManager
        run: npm install -g npm@12.1.0

      - name: Instalacja zaleznosci frontu
        working-directory: frontend
        run: npm ci

      - name: Testy frontu
        working-directory: frontend
        run: npx ng test --watch=false

      - name: Build produkcyjny SPA
        working-directory: frontend
        run: npm run build

  # Image only from code that passed the tests, and only on push to main
  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image name in lowercase (GHCR requirement)
      - name: Build i push obrazu
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ghcr.io/masalskimateusz1/itcardbrawl:${{ github.sha }}
            ghcr.io/masalskimateusz1/itcardbrawl:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # The server directory (/opt/itcardbrawl) is written literally in the ssh commands: variables
      # are passed as separate arguments, not expanded inside the remote command.
      # Key and known_hosts from secrets; host "prod" in ~/.ssh/config (StrictHostKeyChecking defaults to yes)
      - name: Konfiguracja SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ConnectTimeout 20
          EOF
          chmod 600 ~/.ssh/config

      - name: Kopiowanie plikow na serwer
        run: |
          scp deploy/compose.yaml deploy/Caddyfile deploy/deploy.sh prod:/opt/itcardbrawl/
          ssh prod chmod +x /opt/itcardbrawl/deploy.sh

      # The current job's token goes through SSH stdin - it never reaches arguments or logs
      - name: Logowanie serwera do GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | ssh prod docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # deploy.sh rolls back to the previous version by itself when the new one is not healthy
      # Always reload Caddy (idempotent): a Caddyfile change must not get lost when the previous run failed
      - name: Wdrozenie
        run: |
          # SHA through stdin (xargs on the server) - it is not pasted into the remote command
          printf '%s' "$GITHUB_SHA" | ssh prod xargs /opt/itcardbrawl/deploy.sh
          ssh prod "cd /opt/itcardbrawl && docker compose exec -T -w /etc/caddy caddy caddy reload"

      # External check: the public address through Caddy and TLS
      - name: Smoke test
        id: smoke
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          ok=false
          for _ in $(seq 1 12); do
            if curl -fsS --max-time 10 "https://${APP_DOMAIN}/api/ping" | grep -q '"status":"ok"'; then
              ok=true
              break
            fi
            sleep 5
          done
          if [ "$ok" != true ]; then
            echo "::error::/api/ping nie odpowiada {\"status\":\"ok\"} po ~60 s"
            exit 1
          fi
          curl -fsS --max-time 10 "https://${APP_DOMAIN}/" | grep -q '<app-root>' \
            || { echo "::error::strona glowna nie zawiera <app-root>"; exit 1; }

      # Only a smoke test failure - deploy.sh handles a failure of the deployment itself
      - name: Rollback
        if: failure() && steps.smoke.outcome == 'failure'
        run: ssh prod /opt/itcardbrawl/deploy.sh rollback

      # The job token expires when the job ends - we do not leave it in ~/.docker/config.json on the server
      - name: Wylogowanie serwera z GHCR
        if: always()
        run: ssh prod docker logout ghcr.io || true
