# Production profile (SPRING_PROFILES_ACTIVE=prod): the app runs behind a reverse proxy (Caddy) that terminates TLS.
# Scheme and host come from the X-Forwarded-* headers, so the OAuth2 redirect_uri and redirects use https:// and the public domain.
server.forward-headers-strategy=framework
# Session cookie over HTTPS only.
server.servlet.session.cookie.secure=true
