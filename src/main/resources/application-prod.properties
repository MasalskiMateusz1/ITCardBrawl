# Profil produkcyjny (SPRING_PROFILES_ACTIVE=prod): aplikacja za reverse proxy (Caddy) terminujacym TLS.
# Schemat i host z naglowkow X-Forwarded-*, zeby redirect_uri OAuth2 i przekierowania mialy https:// i publiczna domene.
server.forward-headers-strategy=framework
# Cookie sesji tylko po HTTPS.
server.servlet.session.cookie.secure=true
